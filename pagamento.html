<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dock - Pagamento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="lang.js"></script>
    <script>try{if(window.sessionStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
  </head>
  <body class="bg-[var(--bg-color)] text-[var(--font-color)] font-sans">
    <section class="flex flex-col min-h-screen">
      <main class="flex-1 flex flex-col items-center justify-center p-6 w-full max-w-md mx-auto">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full">
          <h1 class="text-2xl font-extrabold mb-6 text-center text-[#F1F5F9] dark:text-[var(--font-color)]">Adicionar Saldo</h1>
          
          <form onsubmit="realizarPagamento(event)" class="space-y-5">
            <div>
              <label class="block text-sm font-semibold mb-1">E-mail</label>
              <input type="email" id="email" class="w-full px-4 py-3 rounded-lg border-2 border-[var(--comp-color)]/50 text-[#0F172A] focus:border-[var(--comp-color)] focus:outline-none transition-colors" placeholder="seu@email.com" required>
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Opção de Carregamento</label>
              <select id="valor" class="w-full px-4 py-3 rounded-lg border-2 border-[var(--comp-color)]/50 text-[#0F172A] focus:border-[var(--comp-color)] focus:outline-none transition-colors" required>
                <option value="" disabled selected>Escolha uma opção</option>
                <option value="1">1€ - 30%</option>
                <option value="3">3€ - 100%</option>
              </select>
            </div>

            <div>
              <label class="block text-sm font-semibold mb-1">Número do Cartão</label>
              <input type="text" class="w-full px-4 py-3 rounded-lg border-2 border-[var(--comp-color)]/50 text-[#0F172A] focus:border-[var(--comp-color)] focus:outline-none transition-colors" placeholder="**** **** **** ****" required maxlength="19">
            </div>

            <div class="flex gap-4">
              <div class="flex-1">
                <label class="block text-sm font-semibold mb-1">Validade</label>
                <input type="text" class="w-full px-4 py-3 rounded-lg border-2 border-[var(--comp-color)]/50 text-[#0F172A] focus:border-[var(--comp-color)] focus:outline-none transition-colors" placeholder="MM/AA" required maxlength="5">
              </div>
              <div class="flex-1">
                <label class="block text-sm font-semibold mb-1">CVV</label>
                <input type="text" class="w-full px-4 py-3 rounded-lg border-2 border-[var(--comp-color)]/50 text-[#0F172A] focus:border-[var(--comp-color)] focus:outline-none transition-colors" placeholder="123" required maxlength="4">
              </div>
            </div>

            <button type="submit" class="w-full py-4 mt-6 bg-[var(--comp-color)] text-white font-bold rounded-lg uppercase tracking-wider hover:opacity-90 active:scale-95 transition-all duration-300 outline-none">
              Confirmar Pagamento
            </button>
          </form>
        </div>
      </main>
    </section>

    <script>
      function realizarPagamento(e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        
        btn.innerHTML = '<span class="animate-pulse">' + t('A Processar...') + '</span>';
        btn.disabled = true;

        // Simula tempo de API
        setTimeout(() => {
          try {
            // Envia o valor pago como número inteiro para o App Inventor
            const valorInput = document.getElementById('valor').value;
            const emailInput = document.getElementById('email').value;
            // Garante que é tratado como inteiro (ex: 10.50 vira 10)
            const valorInteiro = Math.floor(Number(valorInput));
            
            // Integração com Supabase (Guardar e-mail e valor)
            const SUPABASE_URL = "https://cvzhdxfomjxawjwxjmnh.supabase.co";
            const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2emhkeGZvbWp4YXdqd3hqbW5oIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNjc0MzgsImV4cCI6MjA4ODk0MzQzOH0.t6cljClgMgGiCiInch1aYUaR-4v7d35HUYp2yh9mdyU";
            
            // Captura a bateria inicial ao iniciar o carregamento (por defeito 20% no reset)
            let currBat = parseInt(window.sessionStorage.getItem('bateriaAtual')) || 20;

            // Se pagou 1€ (opção 1), soma +30% à bateria. Se pagou a outra opção, vai ao máximo de 100%.
            let limite = valorInteiro === 1 ? (currBat + 30) : 100;
            if (limite > 100) limite = 100; // Limite físico não passa de 100

            try {
              window.sessionStorage.setItem('limiteCarregamento', limite.toString());
              
              // Regista a bateria de início em vez de ser sempre 20 cravado
              window.sessionStorage.setItem('bateriaAtual', currBat.toString());
              
              // Regista o momento ZERO do carregamento para as matemáticas temporais
              let startInfo = { tempoMs: Date.now(), startBattery: currBat };
              window.sessionStorage.setItem('chargeStartInfo', JSON.stringify(startInfo));
              window.sessionStorage.setItem('chargeLog', JSON.stringify([])); // Limpa gráficos velhos
            } catch(err) {
              console.warn("Storage err", err);
            }

            fetch(`${SUPABASE_URL}/rest/v1/pagamentos`, {
              method: 'POST',
              headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
              },
              body: JSON.stringify({ email: emailInput, valor: valorInteiro, data_pagamento: new Date().toISOString() })
            }).catch(err => console.error("Erro Supabase:", err));

            try {
              if (window.AppInventor && window.AppInventor.setWebViewString) {
                window.AppInventor.setWebViewString(valorInteiro.toString());
              }
            } catch(appErr) {
              console.error("AppInventor error", appErr);
            }

            e.target.reset();
            btn.innerHTML = t('Aprovado!');
            
            // Vai direto para o ecrã inicial sem mostrar o container verde intermédio (como no outro form)
            setTimeout(() => {
              window.location.href = "index.html";
            }, 800);
          } catch(generalErr) {
            console.error("Erro na UI", generalErr);
            btn.innerHTML = t('Erro! Voltar');
            btn.disabled = false;
          }
        }, 1500);
      }
    </script>
  </body>
</html>
</html>
