<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>dock - Configurações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="lang.js"></script>
    <!-- Definir cor do App Inventor WebView -->
    <script>
      if(window.sessionStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      let lang = window.sessionStorage.getItem('lang') || 'pt';
    </script>
  </head>
  <body class="bg-[var(--bg-color)] text-[var(--font-color)] font-sans transition-colors duration-300">
    <section class="flex flex-col min-h-screen">
      <nav class="flex justify-start items-center p-6">
        <a href="index.html" class="px-4 py-2 font-semibold text-sm rounded-full bg-white text-[#0F172A] shadow-sm hover:ring-2 hover:ring-[var(--comp-color)] transition-all" id="btn-back">
          &larr; Voltar
        </a>
      </nav>
      
      <main class="flex-1 flex flex-col items-center justify-start p-6 w-full max-w-md mx-auto gap-6">
        <h1 class="text-2xl font-extrabold mb-4 text-center text-[var(--font-color)]" id="title">Refina as Definições</h1>
        
        <!-- Bloco 1: Tema (Modo Escuro / Claro) -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 p-6 w-full text-center">
          <h2 class="text-lg font-bold text-[#F1F5F9] dark:text-[var(--font-color)] mb-3" id="theme-title">Aparência</h2>
          <button onclick="toggleTheme()" class="w-full py-3 bg-[var(--font-color)] text-[var(--bg-color)] font-bold rounded-lg transition-colors border border-transparent hover:border-[var(--comp-color)]" id="btn-theme">
            Alternar Modo Noturno
          </button>
        </div>

        <!-- Bloco 2: Idioma (Português / Inglês) -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 p-6 w-full text-center">
          <h2 class="text-lg font-bold text-[#F1F5F9] dark:text-[var(--font-color)] mb-3" id="lang-title">Idioma / Language</h2>
          <button onclick="toggleLanguage()" class="w-full py-3 bg-[var(--comp-color)] text-white font-bold rounded-lg transition-colors hover:opacity-80" id="btn-lang">
            Mudar para English
          </button>
        </div>

        <!-- Bloco 3: Suporte (Enviar email ao Administrador) -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg hover:shadow-xl transition-shadow duration-300 p-6 w-full">
          <h2 class="text-lg font-bold text-[#F1F5F9] dark:text-[var(--font-color)] mb-3 text-center" id="support-title">Falar com o Administrador</h2>
          <input type="text" id="feedback_contact" class="w-full p-3 rounded-lg border-2 border-[var(--comp-color)]/50 focus:border-[var(--comp-color)] text-[#0F172A] focus:outline-none transition-colors mb-3" placeholder="O seu contacto (Email ou Telemóvel)">
          <textarea id="feedback_msg" rows="4" class="w-full p-3 rounded-lg border-2 border-[var(--comp-color)]/50 focus:border-[var(--comp-color)] text-[#0F172A] focus:outline-none transition-all resize-none mb-3" placeholder="A sua mensagem para o suporte..."></textarea>
          <div id="feedback_status" class="hidden text-sm font-bold text-center mb-3 p-2 rounded-lg transition-all duration-300"></div>
          <button onclick="enviarEmail()" class="w-full py-3 font-semibold text-sm rounded-lg bg-[var(--comp-color)] text-white shadow-sm hover:opacity-90 active:scale-95 transition-all font-bold focus:ring-4 focus:ring-[var(--comp-color)]/50 outline-none" id="btn-send">
            Enviar Email
          </button>
        </div>
      </main>

      <footer class="flex w-full mt-auto bg-[var(--font-color)] text-[var(--bg-color)] cursor-pointer">
        <a href="graficos.html" class="flex-1 py-5 text-center text-sm font-bold uppercase tracking-wider hover:bg-[var(--comp-color)] hover:text-[var(--font-color)] transition-colors duration-300" id="nav-graphs">Gráficos</a>
        <a href="index.html" class="flex-1 py-5 text-center text-sm font-bold uppercase tracking-wider hover:bg-[var(--comp-color)] hover:text-[var(--font-color)] transition-colors duration-300 border-l border-[var(--bg-color)]/20" id="nav-home">Início</a>
        <a href="controlador.html" class="flex-1 py-5 text-center text-sm font-bold uppercase tracking-wider hover:bg-[var(--comp-color)] hover:text-[var(--font-color)] transition-colors duration-300 border-l border-[var(--bg-color)]/20" id="nav-ctrl">Controlador</a>
      </footer>
    </section>

    <script>
      // 1. TEMA (Claro/Escuro)
      function toggleTheme() {
        const doc = document.documentElement;
        const currentTheme = doc.getAttribute('data-theme');
        let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        doc.setAttribute('data-theme', newTheme);
        try{window.sessionStorage.setItem('theme', newTheme);}catch(e){}
        
        // Atualiza a UI deste botão especificamente de acordo com o idioma!
        updateTexts();
      }

      // 2. IDIOMAS (Textos estáticos para PT e EN)
      const dicionario = {
        pt: {
          btnBack: "&larr; Voltar",
          title: "Definições",
          themeTitle: "Aparência",
          btnThemeDark: "Alternar Modo Noturno",
          btnThemeLight: "Alternar Modo Claro",
          langTitle: "Idioma / Language",
          btnLang: "Switch to English",
          suppTitle: "Falar com o Administrador",
          textMsgHide: "A sua mensagem para o suporte...",
          textContactHide: "O seu contacto (Email ou Telemóvel)",
          btnSend: "Enviar Email",
          navGraphs: "Gráficos",
          navCtrl: "Controlador",
          alertEmpty: "Por favor, escreva uma mensagem antes de enviar."
        },
        en: {
          btnBack: "&larr; Back",
          title: "Preferences",
          themeTitle: "Appearance",
          btnThemeDark: "Switch to Dark Mode",
          btnThemeLight: "Switch to Light Mode",
          langTitle: "Idioma / Language",
          btnLang: "Mudar para Português",
          suppTitle: "Contact Administrator",
          textMsgHide: "Type your message to support...",
          textContactHide: "Your contact (Email or Phone)",
          btnSend: "Send Mail",
          navGraphs: "Charts",
          navCtrl: "Controller",
          alertEmpty: "Please type a message before sending."
        }
      };

      function updateTexts() {
        const txt = dicionario[lang];
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

        document.getElementById('btn-back').innerHTML = txt.btnBack;
        document.getElementById('title').innerText = txt.title;
        document.getElementById('theme-title').innerText = txt.themeTitle;
        document.getElementById('btn-theme').innerText = isDark ? txt.btnThemeLight : txt.btnThemeDark;
        document.getElementById('lang-title').innerText = txt.langTitle;
        document.getElementById('btn-lang').innerText = txt.btnLang;
        document.getElementById('support-title').innerText = txt.suppTitle;
        if(document.getElementById('feedback_contact')) document.getElementById('feedback_contact').placeholder = txt.textContactHide;
        document.getElementById('feedback_msg').placeholder = txt.textMsgHide;
        document.getElementById('btn-send').innerText = txt.btnSend;
        document.getElementById('nav-graphs').innerText = txt.navGraphs;
        document.getElementById('nav-ctrl').innerText = txt.navCtrl;
      }

      function toggleLanguage() {
        lang = lang === 'pt' ? 'en' : 'pt';
        try{window.sessionStorage.setItem('lang', lang);}catch(e){}
        updateTexts();
      }

      // Aplica logo ao iniciar
      updateTexts();

      // 3. ENVIAR EMAIL (Sem recarregar e com feedback visual)
      async function enviarEmail() {
        const contatoBox = document.getElementById('feedback_contact');
        const msgBox = document.getElementById('feedback_msg');
        const statusBox = document.getElementById('feedback_status');
        
        const contatoUsuario = contatoBox ? contatoBox.value.trim() : "";
        const msgUsuario = msgBox.value.trim();
        const btnSend = document.getElementById('btn-send');
        
        // Resetar estilos
        msgBox.classList.remove('border-red-500', 'ring-2', 'ring-red-500/50');
        statusBox.classList.add('hidden');
        statusBox.className = "hidden text-sm font-bold text-center mb-3 p-2 rounded-lg transition-all duration-300";

        const txt = dicionario[lang]; // Para usar mensagens dinâmicas
        
        if (!msgUsuario) {
          msgBox.classList.add('border-red-500', 'ring-2', 'ring-red-500/50'); // Mostrar estado de erro
          statusBox.innerText = txt.alertEmpty || "Por favor, escreva uma mensagem antes de enviar.";
          statusBox.classList.remove('hidden');
          statusBox.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-400');
          return;
        }

        // Usar o FormSubmit para envio direto sem criar conta
        const emailAdministrador = "jews6665@gmail.com";
        const endpoint = `https://formsubmit.co/ajax/${emailAdministrador}`; 
        
        const originalText = btnSend.innerHTML;
        btnSend.innerHTML = `<span class="animate-pulse">A enviar...</span>`;
        btnSend.disabled = true;

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            body: JSON.stringify({ 
              _subject: "🚀 Novo Feedback: App SafeCharge",
              "Contacto do Utilizador": contatoUsuario || "Não fornecido",
              "Mensagem Recebida": msgUsuario,
              "Data de Envio": new Date().toLocaleString('pt-PT'),
              "Sistema": "App SafeCharge",
              _template: "table", // template tipo tabela estruturada e profissional
              _captcha: "false" // Desativa o captcha para não sair da app
            }),
            headers: {
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            }
          });

          if (response.ok) {
            msgBox.value = ''; // Limpar a caixa após enviar
            if (contatoBox) contatoBox.value = ''; // Limpar contacto
          } else {
            statusBox.innerText = "Erro ao enviar a mensagem. Tente novamente.";
            statusBox.classList.remove('hidden');
            statusBox.classList.add('bg-red-100', 'text-red-700', 'border', 'border-red-400');
          }
        } catch (error) {
          statusBox.innerText = "Sem internet. Verifique a sua ligação.";
          statusBox.classList.remove('hidden');
          statusBox.classList.add('bg-yellow-100', 'text-yellow-700', 'border', 'border-yellow-400');
        } finally {
          btnSend.innerHTML = originalText;
          btnSend.disabled = false;
        }
      }
    </script>
  </body>
</html>
